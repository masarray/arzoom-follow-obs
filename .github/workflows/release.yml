name: Release Windows installer

# Stable publish requires deliberate manual dispatch OR an explicitly
# pushed version tag, plus matching owner-approved release evidence.
# Ordinary commits to main never publish a public stable release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      approve_stable_release:
        description: "I reviewed physical OBS evidence and approve stable publication"
        required: true
        type: boolean
        default: false
      tested_commit_sha:
        description: "Exact Git commit SHA tested in OBS (must match this main revision)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arzoom-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.ref == 'refs/heads/main' && inputs.approve_stable_release == true) }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version and validate branding
        id: version
        shell: pwsh
        env:
          TESTED_COMMIT_SHA: ${{ inputs.tested_commit_sha || github.sha }}
        run: |
          $spec = Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json
          $version = [string]$spec.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "buildspec.json must contain a semantic release version."
          }

          # A green build is not direct OBS acceptance. This marker must be
          # manually approved and pinned to the precise source commit.
          $acceptancePath = "docs/RELEASE_ACCEPTANCE_v$version.md"
          if (-not (Test-Path -LiteralPath $acceptancePath)) {
            throw "Missing release acceptance record: $acceptancePath"
          }
          $acceptance = Get-Content -LiteralPath $acceptancePath -Raw
          # Reuse the same fail-closed predicate exercised by Windows CI.
          . ./scripts/release-acceptance.ps1
          if (-not (Test-ArZoomReleaseApproval -AcceptanceText $acceptance)) {
            throw "Public release blocked: exactly one APPROVED gate is required."
          }
          $testedSha = $env:TESTED_COMMIT_SHA
          if ($testedSha -ne $env:GITHUB_SHA) {
            throw "The approved tested SHA differs from the release commit."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF -ne "refs/tags/v$version") {
              throw "The explicit release tag must match buildspec.json version v$version."
            }
            # Refuse a stale or side-branch tag. Stable releases must be at
            # the current main head and carry its pre-approved source tree.
            git fetch --no-tags origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not verify remote main SHA." }
            $mainSha = (git rev-parse FETCH_HEAD).Trim()
            if ($mainSha -ne $env:GITHUB_SHA) {
              throw "The release tag must point to the current main commit."
            }
          }
          $readme = Get-Content -LiteralPath "README.md" -Raw
          if (-not $readme.Contains("version-$version")) {
            throw "README still advertises an older version; sync docs first."
          }
          $landing = Get-Content -LiteralPath "docs/index.html" -Raw
          $guide = Get-Content -LiteralPath "docs/guide.html" -Raw
          if (-not $landing.Contains('"softwareVersion": "' + $version + '"') -or
              -not $guide.Contains("ArZoom v$version")) {
            throw "The landing page or setup guide still advertises the previous stable version."
          }
          if (-not (Test-Path -LiteralPath "packaging/windows/arzoom.ico" -PathType Leaf)) {
            throw "Windows installer icon is missing: packaging/windows/arzoom.ico"
          }
          $iss = Get-Content -LiteralPath "packaging/windows/arzoom.iss" -Raw
          if ($iss -notmatch 'SetupIconFile=arzoom\.ico') {
            throw "Inno Setup is not configured to use the ArZoom installer icon."
          }
          ./scripts/validate-brand-assets.ps1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare reviewed release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = "docs/RELEASE_NOTES_v$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Versioned release notes missing: $notes"
          }
          Copy-Item -LiteralPath $notes -Destination ".github-release-notes.md" -Force

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $env:RELEASE_TAG already exists; binary rebuild will be skipped and metadata will be refreshed."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Refresh existing release metadata
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "ArZoom v$env:VERSION" `
            --notes-file ".github-release-notes.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh release metadata for $env:RELEASE_TAG"
          }

      - name: Deterministic validation
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/run-phase0-validation.ps1

      - name: Install Inno Setup
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Prepare clear release assets
        if: steps.existing.outputs.exists != 'true'
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $installer = Get-ChildItem -LiteralPath $releaseDir -Filter "ArZoom-OBS-Setup-v$env:VERSION-windows-x64.exe" -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not generated."
          }

          $stableInstaller = Join-Path $releaseDir "ArZoom-OBS-Setup-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $zip = Join-Path $releaseDir "arzoom-obs-v$env:VERSION-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Version-matched ZIP was not generated: $zip"
          }
          $manualZip = Join-Path $releaseDir "ArZoom-OBS-Manual-v$env:VERSION-windows-x64.zip"
          Copy-Item -LiteralPath $zip -Destination $manualZip -Force

          $hashLines = @()
          foreach ($file in Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -eq "ArZoom-OBS-Setup-windows-x64.exe" -or $_.Name -like "ArZoom-OBS-Manual-*.zip" }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArZoom v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body_path: .github-release-notes.md
          files: |
            release/ArZoom-OBS-Setup-windows-x64.exe
            release/ArZoom-OBS-Manual-v${{ steps.version.outputs.version }}-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
