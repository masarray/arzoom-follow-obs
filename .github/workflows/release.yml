name: Release Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "buildspec.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/windows/**"

permissions:
  contents: write

concurrency:
  group: arzoom-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version and validate branding
        id: version
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json
          $version = [string]$spec.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "buildspec.json does not contain a valid version."
          }
          if (-not (Test-Path -LiteralPath "packaging/windows/arzoom.ico" -PathType Leaf)) {
            throw "Windows installer icon is missing: packaging/windows/arzoom.ico"
          }
          $iss = Get-Content -LiteralPath "packaging/windows/arzoom.iss" -Raw
          if ($iss -notmatch 'SetupIconFile=arzoom\.ico') {
            throw "Inno Setup is not configured to use the ArZoom installer icon."
          }
          ./scripts/validate-brand-assets.ps1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## ArZoom for OBS v$env:VERSION

          **Stable Windows release — generalized Scene Camera mapping + Kinematic Smart Viewport.**

          ### Recommended download

          Download **ArZoom-OBS-Setup-windows-x64.exe**. Close OBS completely and run the installer.

          The installer supports:
          - **Standard OBS Studio** — auto-detected when possible.
          - **OBS Portable / custom OBS folder** — browse to the OBS root containing **bin\64bit\obs64.exe**.

          A manual ZIP and SHA-256 checksums are also provided.

          ### New in v$env:VERSION — P4.1 stable baseline

          - Scene-wide pointer mapping now supports one visible top-level Display Capture with deterministically proven positive axis-aligned **scale/inset placement** and **crop-aware mapping**.
          - Smart Follow, click anchoring, and Presentation Cursor share one read-only mapped coordinate path.
          - Presentation Cursor size follows the exact live camera zoom.
          - Unsupported or ambiguous ownership still fails safe instead of guessing, including multiple candidate Display Captures, unproven rotation/skew/flips, unsupported bounds modes, unresolved nested ownership, or invalid geometry.

          ### Kinematic Smart Viewport

          Scene Camera now separates semantic framing from physical motion:

          - `SceneViewportPlanner` decides **WHERE** the viewport should frame.
          - `SceneKinematicMotion` decides **HOW** the viewport moves there.
          - explicit position + velocity + acceleration state;
          - bounded jerk-limited acceleration changes;
          - live tracking → final settle preserves meaningful motion state instead of stop/restart;
          - latched tracking and continuous follow pressure;
          - conservative confidence-gated pointer prediction, cleared on direction reversal;
          - earlier high-zoom tracking and bounded far-distance cruise authority;
          - automatic moving-target cruise → immutable-target jerk-aware precision braking;
          - exact drift-free HOLD after final framing.

          The accepted product character is: local work stays calm, meaningful far movement is followed promptly, pointer acquisition remains bounded at normal/high zoom, movement stays visually smooth and decisive, and the viewport does not repeatedly search after final pointer intent is known.

          ### Regression lock

          The v$env:VERSION deterministic suite preserves all previous P0–P4 gates and adds P4.1 contracts for generalized mapping, pointer-loss bounds, fixed-target convergence, bounded jerk, no zero-speed stall, retarget velocity continuity, bounded direction reversal, continuous pressure, tracking chatter, final framing, and exact HOLD.

          The accepted baseline is documented in **docs/P4_1_STABLE_BASELINE.md**. Future changes must preserve both pointer acquisition and motion smoothness; one must not be traded away for the other.

          ### Scene Camera architecture remains safe

          - managed `arzoom_filter` attached to the current OBS scene source after normal OBS composition;
          - no persistent `obs_sceneitem_set_*` mutation;
          - no custom scene-wide Camera input source;
          - no duplicate/off-screen scene render graph;
          - no CPU frame readback;
          - no second semantic Smart Camera/planner;
          - bounded O(1) camera state and GPU-native presentation effects.

          ### Presenter system included

          - Toggle Zoom, Hold Zoom, Freeze Camera, Smart Follow On/Off, Zoom +/−, Reset / Full Frame;
          - Overview Peek with exact shot restoration;
          - GPU click visualization;
          - seven built-in tactile Presentation Cursor presets plus Advanced custom assets;
          - camera-aware cursor magnification and deterministic hotspot mapping;
          - first-click render safety on fresh installations.

          ### Platform / scope

          - Windows 10/11 x64.
          - Current build baseline: OBS Studio 31.1.1.
          - macOS/Linux are not included in this release.
          - P4.2 deterministic multi-capture target selection remains future work; v$env:VERSION never guesses capture ownership.

          ArZoom remains scene-safe by design: presentation transforms occur in the filter output and do not persistently modify the user's scene-item transforms.
          "@ | Set-Content -LiteralPath ".github-release-notes.md" -Encoding utf8

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $env:RELEASE_TAG already exists; binary rebuild will be skipped and metadata will be refreshed."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Refresh existing release metadata
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "ArZoom v$env:VERSION" `
            --notes-file ".github-release-notes.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh release metadata for $env:RELEASE_TAG"
          }

      - name: Deterministic motion validation
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/run-phase0-validation.ps1

      - name: Install Inno Setup
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Prepare clear release assets
        if: steps.existing.outputs.exists != 'true'
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $installer = Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not generated."
          }

          $stableInstaller = Join-Path $releaseDir "ArZoom-OBS-Setup-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $zip = Get-ChildItem -LiteralPath $releaseDir -Filter "*.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($zip) {
            $manualZip = Join-Path $releaseDir "ArZoom-OBS-Manual-v$env:VERSION-windows-x64.zip"
            if ($zip.FullName -ne $manualZip) {
              Copy-Item -LiteralPath $zip.FullName -Destination $manualZip -Force
            }
            "manual_zip=$manualZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $hashLines = @()
          foreach ($file in Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -eq "ArZoom-OBS-Setup-windows-x64.exe" -or $_.Name -like "ArZoom-OBS-Manual-*.zip" }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArZoom v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body_path: .github-release-notes.md
          files: |
            release/ArZoom-OBS-Setup-windows-x64.exe
            release/ArZoom-OBS-Manual-v${{ steps.version.outputs.version }}-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
