name: Release Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "buildspec.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/windows/**"

permissions:
  contents: write

concurrency:
  group: arzoom-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json
          $version = [string]$spec.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "buildspec.json does not contain a valid version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare stable release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## ArZoom for OBS v$env:VERSION

          **Stable release** of the Smart Zone Gimbal Camera + Premium GPU Click Visualization + Presenter Controls + tactile Presentation Cursor for OBS Display Capture.

          ### Recommended download

          Download **`ArZoom-OBS-Setup-windows-x64.exe`**. Close OBS completely and run the installer.

          The same installer supports:
          - **Standard OBS Studio** — auto-detected when possible.
          - **OBS Portable / custom OBS folder** — browse to the OBS root that contains `bin\\64bit\\obs64.exe`.

          A manual ZIP and SHA-256 checksums are also provided.

          ### Presenter Controls

          - **Toggle Zoom** — existing profile-compatible latched zoom control;
          - **Hold Zoom** — momentary zoom that composes correctly with Toggle Zoom;
          - **Freeze Camera** — locks the exact current framing while the pointer can move elsewhere;
          - **Toggle Smart Follow** — keeps zoom active while independently suspending/re-enabling pointer-driven framing;
          - **Zoom In / Zoom Out** — live 0.25x presenter steps within the supported 1.10x–4.00x range;
          - **Reset / Full Frame** — one safe recovery command that clears temporary presenter states and returns through the existing minimum-jerk 1x path;
          - **Overview Peek** — hold for a smooth temporary 1x overview, release to return to the exact previous zoom + focus transform.

          ### Presentation Cursor

          - preset-first GUI: choose a built-in style and it works immediately;
          - seven original ArZoom cursor styles: **Prism, Outline, Azure, Orchid, Parakeet, Classic Hand, Sticker Hand**;
          - built-in clicks use a short tactile micro-interaction: fast press → elastic release → tiny rebound → exact settle;
          - arrow-tip and fingertip hotspots remain aligned through camera zoom/pan;
          - cursor magnifies with the camera at 1x/2x/3x/4x;
          - built-ins are rendered to a transparent GPU atlas only when the preset/settings change — no image decoding on click or per video frame;
          - **Custom…** remains available as an Advanced GIF/WebP/PNG path;
          - ArZoom warns when native Display Capture cursor capture is still enabled to avoid double cursors;
          - third-party prototype artwork is not redistributed; shipped built-ins are original ArZoom geometry.

          ### Camera + click highlights

          - **Smart Zone → Follow → Coast → SmoothIdle** follows real presentation-area changes instead of ordinary pointer jitter;
          - straight, focus-preserving quintic minimum-jerk zoom-in and wobble-free zoom-out;
          - local circles, pointing, and explanation gestures stay steady inside the current presentation area;
          - **Premium GPU Click Visualization** uses clean analytic dual-vector rings with restrained polish and clean dissolve;
          - left click: **Azure + Aqua**; right click: **Violet + Orchid**; middle click: compact **Amber + Gold**;
          - luminance-aware compositing keeps click feedback readable on white/Explorer and dark content;
          - click positions remain anchored to content while Smart Camera zoom/pan moves;
          - click feedback cannot wake, retarget, or accelerate Smart Zone camera motion;
          - one GPU presentation pass for active presentation effects;
          - Cinematic, Balanced, and Responsive camera characters;
          - presenter hotkeys persist per OBS profile;
          - deterministic showing-filter target semantics with safe release behavior across scene changes;
          - fool-proof Standard OBS + OBS Portable/custom installer;
          - Windows 10/11 x64 and OBS Display Capture.

          Phase 3.5 is complete in this release. v0.4.1 is the frozen baseline for **Phase 4 — ArZoom Camera**, the upcoming scene-wide GPU presentation camera mode.
          "@ | Set-Content -LiteralPath ".github-release-notes.md" -Encoding utf8

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $env:RELEASE_TAG already exists; binary rebuild will be skipped and metadata will be refreshed."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Refresh existing stable release metadata
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "ArZoom v$env:VERSION" `
            --notes-file ".github-release-notes.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh stable release metadata for $env:RELEASE_TAG"
          }

      - name: Deterministic motion validation
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/run-phase0-validation.ps1

      - name: Install Inno Setup
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Prepare clear release assets
        if: steps.existing.outputs.exists != 'true'
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $installer = Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not generated."
          }

          $stableInstaller = Join-Path $releaseDir "ArZoom-OBS-Setup-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $zip = Get-ChildItem -LiteralPath $releaseDir -Filter "*.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($zip) {
            $manualZip = Join-Path $releaseDir "ArZoom-OBS-Manual-v$env:VERSION-windows-x64.zip"
            if ($zip.FullName -ne $manualZip) {
              Copy-Item -LiteralPath $zip.FullName -Destination $manualZip -Force
            }
            "manual_zip=$manualZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $hashLines = @()
          foreach ($file in Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -eq "ArZoom-OBS-Setup-windows-x64.exe" -or $_.Name -like "ArZoom-OBS-Manual-*.zip" }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArZoom v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body_path: .github-release-notes.md
          files: |
            release/ArZoom-OBS-Setup-windows-x64.exe
            release/ArZoom-OBS-Manual-v${{ steps.version.outputs.version }}-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
