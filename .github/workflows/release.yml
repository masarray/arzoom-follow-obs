name: Release Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "buildspec.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/windows/**"

permissions:
  contents: write

concurrency:
  group: arzoom-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version and validate branding
        id: version
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json
          $version = [string]$spec.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "buildspec.json does not contain a valid version."
          }
          if (-not (Test-Path -LiteralPath "packaging/windows/arzoom.ico" -PathType Leaf)) {
            throw "Windows installer icon is missing: packaging/windows/arzoom.ico"
          }
          $iss = Get-Content -LiteralPath "packaging/windows/arzoom.iss" -Raw
          if ($iss -notmatch 'SetupIconFile=arzoom\.ico') {
            throw "Inno Setup is not configured to use the ArZoom installer icon."
          }
          ./scripts/validate-brand-assets.ps1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## ArZoom for OBS v$env:VERSION

          **Stable Windows release — Cinematic Spotlight + accepted P4.1 Smart Viewport.**

          ### Recommended download

          Download **ArZoom-OBS-Setup-windows-x64.exe**. Close OBS completely and run the installer.

          The installer supports:
          - **Standard OBS Studio** — auto-detected when possible.
          - **OBS Portable / custom OBS folder** — browse to the OBS root containing **bin\64bit\obs64.exe**.

          A manual ZIP and SHA-256 checksums are also provided.

          ### New in v$env:VERSION — Spotlight + cinematic focus

          - Three Spotlight behavior modes: **Smart Focus**, **Follow cursor**, and **Click to lock**.
          - Stable default: **Follow cursor**, **Circle**, **170% area**, **35% background dim**, **40 px edge softness**.
          - Default Presentation Cursor: **ArZoom Classic Hand**.
          - **Cinematic Spotlight with Zoom** smoothly closes from full-frame context into focus when Toggle Zoom turns on, then opens back to a full bright frame when Zoom turns off.
          - Balanced cinematic motion uses a time-based minimum-jerk curve and supports smooth mid-animation reversal.
          - **Zoom In / Zoom Out are resize-only** while Zoom is active: camera, Presentation Cursor, and Spotlight grow/shrink smoothly without replaying the cinematic focus animation.
          - Manual Toggle/Hold/Peek Spotlight controls remain independent presenter intent.

          Spotlight master controls remain Off by default so adding ArZoom never puts an attention effect on-air without presenter opt-in.

          ### Reliability fixes proven in direct OBS

          P5 development exposed and fixed a real D3D11 black-frame failure. The stable renderer now initializes the complete shared shader ABI before every processed Draw, including neutral values for inactive optional effects.

          Direct OBS acceptance confirmed:
          - zero click/Zoom/cursor black-preview regression;
          - changing Presentation Cursor styles remains healthy;
          - Spotlight Toggle is no longer needed as a render-recovery action;
          - Spotlight runtime buttons no longer rebuild/flicker the OBS Properties sheet;
          - cinematic Toggle Zoom ON/OFF is stable;
          - Zoom +/- no longer restarts the cinematic iris.

          ### Kinematic Smart Viewport retained

          v$env:VERSION preserves the accepted v0.6.0 P4.1 camera/mapping baseline:
          - deterministic read-only mapping for one proven top-level Display Capture;
          - positive axis-aligned fullscreen/scale/inset and proven crop-aware layouts;
          - shared mapped coordinates for Smart Follow, click, Presentation Cursor, and Spotlight;
          - SceneViewportPlanner decides **WHERE** to frame;
          - SceneKinematicMotion decides **HOW** to move there;
          - jerk-limited motion, far cruise, precision braking, and exact HOLD.

          Ambiguous capture ownership still fails safe rather than guessing. P4.2 deterministic multi-capture target selection remains future work.

          ### Performance and scene safety

          - one shared presentation render path;
          - analytic GPU Spotlight mask;
          - no duplicate scene render;
          - no persistent scene-item transform mutation;
          - no helper source;
          - no CPU frame readback;
          - no OCR/AI/image analysis;
          - bounded O(1) presentation state;
          - OBS pass-through remains available when presentation effects are inactive.

          ### Validation

          The accepted v$env:VERSION candidate passed **19/19 deterministic P0–P5 tests**, Windows C++/shader compilation, installer packaging, and direct OBS acceptance.

          Stable contracts:
          - **docs/P4_1_STABLE_BASELINE.md**
          - **docs/P5_STABLE_BASELINE.md**

          ### Platform / scope

          - Windows 10/11 x64.
          - Build baseline: OBS Studio 31.1.1.
          - Direct accepted field environment included OBS 32.1.2 / D3D11.
          - macOS/Linux are not included in this release.
          "@ | Set-Content -LiteralPath ".github-release-notes.md" -Encoding utf8

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $env:RELEASE_TAG already exists; binary rebuild will be skipped and metadata will be refreshed."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Refresh existing release metadata
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "ArZoom v$env:VERSION" `
            --notes-file ".github-release-notes.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh release metadata for $env:RELEASE_TAG"
          }

      - name: Deterministic validation
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/run-phase0-validation.ps1

      - name: Install Inno Setup
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Prepare clear release assets
        if: steps.existing.outputs.exists != 'true'
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $installer = Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not generated."
          }

          $stableInstaller = Join-Path $releaseDir "ArZoom-OBS-Setup-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $zip = Get-ChildItem -LiteralPath $releaseDir -Filter "*.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($zip) {
            $manualZip = Join-Path $releaseDir "ArZoom-OBS-Manual-v$env:VERSION-windows-x64.zip"
            if ($zip.FullName -ne $manualZip) {
              Copy-Item -LiteralPath $zip.FullName -Destination $manualZip -Force
            }
          }

          $hashLines = @()
          foreach ($file in Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -eq "ArZoom-OBS-Setup-windows-x64.exe" -or $_.Name -like "ArZoom-OBS-Manual-*.zip" }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArZoom v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body_path: .github-release-notes.md
          files: |
            release/ArZoom-OBS-Setup-windows-x64.exe
            release/ArZoom-OBS-Manual-v${{ steps.version.outputs.version }}-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
