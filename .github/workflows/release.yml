name: Release Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "buildspec.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "src/**"
      - "data/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/windows/**"

permissions:
  contents: write

concurrency:
  group: arzoom-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version and validate branding
        id: version
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath "buildspec.json" -Raw | ConvertFrom-Json
          $version = [string]$spec.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "buildspec.json does not contain a valid version."
          }
          if (-not (Test-Path -LiteralPath "packaging/windows/arzoom.ico" -PathType Leaf)) {
            throw "Windows installer icon is missing: packaging/windows/arzoom.ico"
          }
          $iss = Get-Content -LiteralPath "packaging/windows/arzoom.iss" -Raw
          if ($iss -notmatch 'SetupIconFile=arzoom\.ico') {
            throw "Inno Setup is not configured to use the ArZoom installer icon."
          }
          ./scripts/validate-brand-assets.ps1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## ArZoom for OBS v$env:VERSION

          **Public release of ArZoom Scene Camera for Windows.**

          ArZoom can now zoom and follow the **composed OBS scene** instead of requiring presentation effects to live only on one Display Capture source. Display Capture, webcam, browser, logo, and nested-scene content can move together through the same accepted Smart Zone camera runtime.

          ### Recommended download

          Download **`ArZoom-OBS-Setup-windows-x64.exe`**. Close OBS completely and run the installer.

          The installer supports:
          - **Standard OBS Studio** — auto-detected when possible.
          - **OBS Portable / custom OBS folder** — browse to the OBS root containing `bin\\64bit\\obs64.exe`.
          - branded ArZoom installer/uninstall icon and version metadata.

          A manual ZIP and SHA-256 checksums are also provided.

          ### New in v$env:VERSION — ArZoom identity and release media

          - Canonical ArZoom logo across the repository and landing page.
          - Multi-resolution favicons and Apple touch icon.
          - Six-resolution Windows installer/uninstaller icon and embedded plugin DLL icon.
          - Real OBS product screenshot and a 1200×630 social preview image.
          - Release gates verify asset identity, dimensions, metadata, and icon wiring before packaging.

          ### Scene Camera

          - **Tools → ArZoom — Toggle Scene Camera** creates or enables a managed `ArZoom Camera` filter on the current OBS scene.
          - **Tools → ArZoom — Configure Scene Camera** opens the scene's normal Filters dialog.
          - Scene Camera runs after OBS has composed Display Capture, webcam, browser, logo, and nested scenes, so they zoom together.
          - ArZoom does **not** rewrite scene-item position, scale, rotation, bounds, or crop.
          - No hidden helper scene item, CPU frame readback, second camera engine, or duplicated scene-render graph.
          - Existing per-source **ArZoom Filter** remains available for the lightest Display Capture-only workflow.

          ### Mapping safety

          Pointer-driven Smart Follow, click anchoring, and Presentation Cursor are enabled only when ArZoom can prove a deterministic Display Capture → scene mapping. The initial supported scene-wide case is exactly one visible fullscreen Display Capture whose monitor can be resolved safely.

          Cropped/scaled/rotated or multiple Display Capture layouts are treated as ambiguous: ArZoom does not guess pointer coordinates. Presenter controls and safe fixed framing remain available.

          ### Presentation system included

          - Smart Zone → Follow / Catch-Up → Coast → SmoothIdle gimbal behavior;
          - focus-preserving quintic minimum-jerk zoom trajectories;
          - Cinematic, Balanced, and Responsive camera characters;
          - Toggle Zoom, Hold Zoom, Freeze Camera, Smart Follow On/Off, Zoom +/−, Reset / Full Frame;
          - Overview Peek with exact shot restoration;
          - premium one-pass GPU click visualization;
          - seven built-in tactile Presentation Cursor presets plus Advanced custom assets;
          - cursor magnification with camera zoom and deterministic hotspot mapping;
          - fresh-install first-click render safety: the shared GPU pass now always has a valid transparent cursor sampler before any cursor style is selected.

          ### Recommended Scene Camera setup

          1. Use one fullscreen Display Capture as the presentation area.
          2. Disable old per-source ArZoom filters while Scene Camera is active to avoid double zoom.
          3. Choose **Tools → ArZoom — Toggle Scene Camera**.
          4. Configure it through **Tools → ArZoom — Configure Scene Camera**.
          5. If using ArZoom Presentation Cursor, disable the native Display Capture cursor to avoid a double cursor.
          6. Assign presenter controls in **OBS Settings → Hotkeys**.

          ### Platform / scope

          - Windows 10/11 x64.
          - Current build baseline: OBS Studio 31.1.1.
          - Scene-wide Smart Follow currently requires the deterministic fullscreen Display Capture mapping described above.
          - macOS/Linux are not included in this release.

          ArZoom remains scene-safe by design: presentation transforms occur in the filter output and do not persistently modify the user's scene-item transforms.
          "@ | Set-Content -LiteralPath ".github-release-notes.md" -Encoding utf8

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $env:RELEASE_TAG already exists; binary rebuild will be skipped and metadata will be refreshed."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Refresh existing release metadata
        if: steps.existing.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "ArZoom v$env:VERSION" `
            --notes-file ".github-release-notes.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh release metadata for $env:RELEASE_TAG"
          }

      - name: Deterministic motion validation
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/run-phase0-validation.ps1

      - name: Install Inno Setup
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Prepare clear release assets
        if: steps.existing.outputs.exists != 'true'
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $installer = Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not generated."
          }

          $stableInstaller = Join-Path $releaseDir "ArZoom-OBS-Setup-windows-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          $zip = Get-ChildItem -LiteralPath $releaseDir -Filter "*.zip" -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($zip) {
            $manualZip = Join-Path $releaseDir "ArZoom-OBS-Manual-v$env:VERSION-windows-x64.zip"
            if ($zip.FullName -ne $manualZip) {
              Copy-Item -LiteralPath $zip.FullName -Destination $manualZip -Force
            }
            "manual_zip=$manualZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $hashLines = @()
          foreach ($file in Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Name -eq "ArZoom-OBS-Setup-windows-x64.exe" -or $_.Name -like "ArZoom-OBS-Manual-*.zip" }) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArZoom v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body_path: .github-release-notes.md
          files: |
            release/ArZoom-OBS-Setup-windows-x64.exe
            release/ArZoom-OBS-Manual-v${{ steps.version.outputs.version }}-windows-x64.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
