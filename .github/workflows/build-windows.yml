name: Build Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Deterministic motion validation
        shell: pwsh
        run: |
          ./scripts/run-phase0-validation.ps1

      - name: Upload motion benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: arzoom-motion-benchmark-windows-x64
          path: phase0-benchmark.txt
          if-no-files-found: error
          retention-days: 14

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build plugin and fool-proof installer
        shell: pwsh
        run: |
          ./scripts/build-local-windows.ps1 -VisualStudio 2022 -Ci

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: arzoom-windows-x64
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error
